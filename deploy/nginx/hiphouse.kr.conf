# Host-level nginx reverse proxy for hiphouse.kr
# Fronts the `web` container (docker-compose.prod.yml), which is published on
# 127.0.0.1:8080 and internally serves the SPA + proxies /api -> api:8080.
#
# Install:
#   sudo cp deploy/nginx/hiphouse.kr.conf /etc/nginx/sites-available/hiphouse.kr
#   sudo ln -s /etc/nginx/sites-available/hiphouse.kr /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# First-time TLS (the 443 block below references certs that don't exist yet):
#   1) Comment out the whole `server { listen 443 ... }` block below and the
#      `return 301 https://...` line (keep the ACME location), reload nginx.
#   2) sudo certbot certonly --webroot -w /var/www/certbot -d hiphouse.kr -d www.hiphouse.kr
#   3) Uncomment the 443 block + redirect, reload nginx.
#   (Or just run `sudo certbot --nginx -d hiphouse.kr -d www.hiphouse.kr` and let
#    certbot rewrite this file for you.)

# robots.txt를 무시하는 봇/스크립트용 안전망 — 예의 바른 크롤러는 robots.txt
# (apps/web/public/robots.txt)에서 걸러지고, 나머지는 여기서 IP당 속도로 잡힌다.
# 10m zone = 약 16만 IP 추적. rate는 사람 한 명의 정상 사용량보다 넉넉하게.
limit_req_zone  $binary_remote_addr zone=hiphouse_req:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=hiphouse_conn:10m;
limit_req_status  429;
limit_conn_status 429;

upstream hiphouse_web {
    server 127.0.0.1:8080;
    keepalive 32;
}

# ---- HTTP: ACME challenge + redirect everything to HTTPS ----
server {
    listen 80;
    server_name hiphouse.kr www.hiphouse.kr;

    # Let's Encrypt webroot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS ----
server {
    # `http2 on;` requires nginx >= 1.25.1; use the legacy `listen ... http2`
    # form so older distro nginx (Ubuntu 22.04 etc.) accepts it too.
    listen 443 ssl http2;
    server_name hiphouse.kr www.hiphouse.kr;

    ssl_certificate     /etc/letsencrypt/live/hiphouse.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hiphouse.kr/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 초과분은 큐잉 없이 즉시 429 — 봇은 튕기고, SPA 자산 동시 로드는 burst로 흡수.
    limit_req  zone=hiphouse_req burst=60 nodelay;
    limit_conn hiphouse_conn 30;

    # Uploads / crawled artwork can be large-ish; give some headroom.
    client_max_body_size 20m;

    # Everything (SPA + /api) goes to the web container, which handles routing.
    location / {
        proxy_pass         http://hiphouse_web;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_set_header   Connection        "";

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }
}
