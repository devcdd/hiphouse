<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root { --bg:#0d0d0d; --fg:#f5f5f5; --muted:#8a8a8a; --yellow:#FEE500; }
  * { box-sizing:border-box; margin:0; }
  html,body { width:1080px; height:1350px; background:var(--bg); color:var(--fg);
    font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif; overflow:hidden; }
  .poster { position:relative; isolation:isolate; width:1080px; height:1350px; padding:72px; display:flex; flex-direction:column; align-items:center; text-align:center; }
  .top { width:100%; display:flex; align-items:center; justify-content:space-between; }
  .logo { height:56px; filter:invert(1); }
  .pill { font-size:22px; font-weight:600; color:var(--muted); letter-spacing:.02em; }
  .kicker { margin-top:56px; font-size:26px; font-weight:700; color:var(--yellow); letter-spacing:.04em; }
  h1 { margin-top:16px; font-size:76px; line-height:1.15; font-weight:800; letter-spacing:-0.03em; word-break:keep-all; }
  h1 em { font-style:normal; color:var(--yellow); }
  .sub { margin-top:22px; font-size:30px; line-height:1.45; color:var(--muted); font-weight:500; word-break:keep-all; max-width:860px; }
  .tags { display:flex; gap:12px; margin-top:26px; justify-content:center; }
  .tag { padding:10px 20px; border-radius:999px; background:#1c1c1c; font-size:24px; font-weight:600; color:#ddd; }
  .tag.on { background:#f5f5f5; color:#111; }
  .stage { position:absolute; left:0; right:0; bottom:0; top:560px; display:flex; justify-content:center; align-items:flex-start; }
  .phone { width:520px; aspect-ratio:1170/2532; border-radius:64px; background:#000; padding:14px;
    box-shadow:0 40px 100px rgba(0,0,0,.6), 0 0 0 2px #2a2a2a; overflow:hidden; flex:none; }
  .phone img { width:100%; height:100%; display:block; border-radius:50px; object-fit:cover; }
  .stage.pair { gap:36px; } .stage.pair .phone { width:450px; }
  .stage.pair .phone:nth-child(2) { margin-top:90px; }
  .fade { position:absolute; left:0; right:0; bottom:0; height:160px; z-index:4; pointer-events:none;
    background:linear-gradient(to bottom, rgba(13,13,13,0), var(--bg)); }
  /* cover */
  .cover h1 { font-size:128px; margin-top:0; line-height:1.05; }
  .cover .sub { font-size:34px; }
  .cover .kicker { margin-top:120px; }
  /* thumb (1080x1080) */
    .thumb { justify-content:center; padding-bottom:0; }
  .thumb h1 { font-size:190px; line-height:1; margin-top:16px; }
  .thumb h2 { margin-top:36px; font-size:44px; font-weight:700; letter-spacing:-0.02em; word-break:keep-all; }
  .thumb .sub { margin-top:14px; font-size:28px; }
  .thumb .url { margin-top:48px; font-size:34px; font-weight:800; padding:16px 36px; border-radius:999px; background:var(--yellow); color:#111; }
  .thumb .grid { position:absolute; inset:0; z-index:-1; opacity:.22; display:grid; grid-template-columns:repeat(4,1fr); grid-auto-rows:270px; gap:0; overflow:hidden; }
  .thumb .grid img { width:100%; aspect-ratio:1; object-fit:cover; }
  .thumb .vignette { position:absolute; inset:0; z-index:-1; background:radial-gradient(ellipse at center, rgba(13,13,13,.55) 20%, var(--bg) 75%); }
</style>
</head>
<body class="{{bodycls}}">
<div class="poster {{cls}}">
  {{body}}
</div>
</body>
</html>
