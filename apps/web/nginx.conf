# 링크 스크래퍼(카톡·트위터·디스코드·검색봇)는 JS를 실행하지 않는다. SPA를 그대로
# 주면 index.html의 기본 메타만 읽어 모든 앨범 링크가 똑같은 카드로 보인다.
# 이 UA들만 API의 /og/... 프리렌더로 넘기고, 사람은 평소대로 SPA를 받는다.
map $http_user_agent $is_link_scraper {
  default 0;
  "~*(facebookexternalhit|Facebot|Twitterbot|kakaotalk-scrap|Slackbot|Discordbot|TelegramBot|WhatsApp|LinkedInBot|Pinterest|redditbot|Applebot|SkypeUriPreview|Googlebot|Daumoa|Yeti)" 1;
}

# TLS는 바깥(호스트) nginx가 끝내고 이 컨테이너엔 http로 들어온다. $scheme을 그대로 넘기면
# API가 canonical·og:url·사이트맵을 http://로 만든다. 바깥에서 받은 값을 우선한다.
map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  "" $scheme;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # API proxy: /api/albums -> api:8080/albums (strips /api like the dev proxy)
  location ^~ /api/ {
    proxy_pass http://api:8080/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
  }

  # 앨범·아티스트 상세가 프리렌더 대상이다. 공유와 검색 유입이 거의 여기로 들어온다.
  # `if` 안에서 안전하게 쓸 수 있는 건 return/rewrite...last 둘뿐이라 rewrite를 쓴다.
  location ~ ^/(albums|artists)/[^/]+$ {
    if ($is_link_scraper) {
      rewrite ^/(albums|artists)/(.+)$ /__og/$1/$2 last;
    }
    try_files $uri /index.html;
  }

  location = /sitemap.xml {
    proxy_pass http://api:8080/sitemap.xml;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-Host $host;
  }

  # 확장자가 붙은 경로는 정적 파일이다. 없는 파일까지 index.html을 200으로 주면 검색엔진이
  # soft 404로 본다(예: /wp-login.php, /ads.txt).
  location ~ \.[A-Za-z0-9]+$ {
    try_files $uri =404;
  }

  # internal: 위 rewrite로만 진입 가능. 외부에서 /__og/를 직접 때리면 404.
  location ^~ /__og/ {
    internal;
    proxy_pass http://api:8080/og/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-Host $host;
  }

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }
}
