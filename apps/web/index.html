<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Google Tag Manager(GTM-N7HC2BFF). GA4(G-9BE66NGLR9)는 컨테이너 안에서 설정한다.
         로컬 개발·미리보기 방문이 통계에 섞이지 않게 운영 도메인에서만 gtm.js를 불러온다. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      if (/(^|\.)hiphouse\.kr$/.test(location.hostname)) {
        var gtm = document.createElement('script');
        gtm.async = true;
        gtm.src = 'https://www.googletagmanager.com/gtm.js?id=GTM-N7HC2BFF';
        document.head.appendChild(gtm);
      }
    </script>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>힙집 HipHouse</title>
    <!-- 앨범·아티스트 상세는 nginx가 스크래퍼 UA만 API 프리렌더(/og/...)로 넘겨 페이지별
         카드를 준다. 여기 기본값은 그 외 경로(루트·검색·프로필)가 공유될 때 쓰인다.
         canonical과 og:url은 넣지 않는다. 모든 경로가 이 파일을 받아서, 고정값을 두면
         검색엔진이 모든 페이지를 홈의 중복으로 본다. -->
    <meta name="description" content="년도별로 골라 보는 힙합 앨범. 평가하고, 즐겨찾기하고, 취향을 나눠보세요." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="힙집" />
    <meta property="og:title" content="힙집 HipHouse" />
    <meta property="og:description" content="년도별로 골라 보는 힙합 앨범. 평가하고, 즐겨찾기하고, 취향을 나눠보세요." />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:image" content="https://hiphouse.kr/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Apply saved theme before paint to avoid a flash.
      try {
        var t = localStorage.getItem('theme')
        if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
