name: build-and-deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write # push images to ghcr.io using GITHUB_TOKEN (no PAT needed)

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: go test ./...
        working-directory: apps/api
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @hiphouse/web build

  build-push:
    needs: test
    # 서버가 t4g(arm64)라 arm 러너에서 네이티브 빌드 — QEMU 에뮬레이션 없이.
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        include:
          - name: api
            context: apps/api
            dockerfile: apps/api/Dockerfile
          - name: web
            context: .
            dockerfile: apps/web/Dockerfile
          - name: crawler
            context: .
            dockerfile: apps/crawler/Dockerfile
    steps:
      - uses: actions/checkout@v4
      # buildx enables the gha cache backend below.
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/hiphouse-${{ matrix.name }}
          tags: |
            type=raw,value=latest
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_KAKAO_REST_API_KEY=${{ secrets.VITE_KAKAO_REST_API_KEY }}
          # Reuse layers across CI runs: unchanged layers keep identical digests,
          # so builds skip pnpm/go work AND the server pulls only changed layers.
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # Runs ON the server via the self-hosted runner (name: hiphouse, user: ubuntu) — no SSH needed.
  # DEPLOY_PATH (repo variable) must already contain .env (see .env.example).
  deploy:
    needs: build-push
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Roll the stack
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/root/hiphouse' }}
          # Isolated docker config: the job's ghcr login (short-lived GITHUB_TOKEN)
          # must not clobber the operator's persistent PAT login in ~/.docker.
          DOCKER_CONFIG: /tmp/hiphouse-deploy-docker
        run: |
          mkdir -p "$DEPLOY_PATH" "$DOCKER_CONFIG"
          cp docker-compose.prod.yml "$DEPLOY_PATH/"
          cd "$DEPLOY_PATH"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml up -d
          docker image prune -f
