name: build-and-deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write # push images to ghcr.io using GITHUB_TOKEN (no PAT needed)

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: go test ./...
        working-directory: apps/api
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @hiphouse/web build

  build-push:
    needs: test
    # 서버가 t4g(arm64)라 arm 러너에서 네이티브 빌드 — QEMU 에뮬레이션 없이.
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        include:
          - name: api
            context: apps/api
            dockerfile: apps/api/Dockerfile
          - name: web
            context: .
            dockerfile: apps/web/Dockerfile
          - name: crawler
            context: .
            dockerfile: apps/crawler/Dockerfile
    steps:
      - uses: actions/checkout@v4
      # buildx enables the gha cache backend below.
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/hiphouse-${{ matrix.name }}
          tags: |
            type=raw,value=latest
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_KAKAO_REST_API_KEY=${{ secrets.VITE_KAKAO_REST_API_KEY }}
          # Reuse layers across CI runs: unchanged layers keep identical digests,
          # so builds skip pnpm/go work AND the server pulls only changed layers.
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # 서버(1.8GB)에 러너·빌드 부담을 두지 않으려고, GitHub 러너에서 SSH 로 서버에 접속해 재기동만 한다.
  # DEPLOY_PATH (repo variable) must already contain .env (see .env.example).
  # secrets: EC2_HOST, EC2_SSH_KEY(배포 전용 키), EC2_KNOWN_HOSTS(서버 호스트 키 고정)
  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: SSH 설정
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Roll the stack
        env:
          SERVER: ubuntu@${{ secrets.EC2_HOST }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/root/hiphouse' }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_MUSIC_PRIVATE_KEY: ${{ secrets.APPLE_MUSIC_PRIVATE_KEY }}
          APPLE_MUSIC_TEAM_ID: ${{ secrets.APPLE_MUSIC_TEAM_ID }}
          APPLE_MUSIC_KEY_ID: ${{ secrets.APPLE_MUSIC_KEY_ID }}
        run: |
          ssh "$SERVER" "mkdir -p '$DEPLOY_PATH'"
          scp docker-compose.prod.yml "$SERVER:$DEPLOY_PATH/"
          # 값은 원격 셸 stdin 으로만 넘김 — ssh 인자로 넘기면 서버 ps 에 비밀값이 보이고 따옴표도 깨짐
          {
            printf 'export %s=%q\n' DEPLOY_PATH "$DEPLOY_PATH" IMAGE_TAG "sha-${GITHUB_SHA::7}" \
              GHCR_USER "$GITHUB_ACTOR" GHCR_TOKEN "$GHCR_TOKEN" \
              APPLE_MUSIC_PRIVATE_KEY "$APPLE_MUSIC_PRIVATE_KEY" \
              APPLE_MUSIC_TEAM_ID "$APPLE_MUSIC_TEAM_ID" APPLE_MUSIC_KEY_ID "$APPLE_MUSIC_KEY_ID"
            cat <<'EOF'
          set -euo pipefail
          # 같은 서버에 배포하는 다른 프로젝트와 순서대로 — 동시에 돌면 상대의 image prune 이 받는 중인 이미지를 지움
          exec 9>/tmp/docker-deploy.lock
          flock 9
          cd "$DEPLOY_PATH"
          # Apple MusicKit 키: secrets → 서버 파일 + .env 항목 (나머지 .env는 서버가 관리).
          # api 컨테이너가 nonroot(65532)로 읽어야 해서 644 — 파일은 배포 경로 밖으로 안 나간다.
          if [ -n "$APPLE_MUSIC_PRIVATE_KEY" ]; then
            mkdir -p secrets
            printf '%s\n' "$APPLE_MUSIC_PRIVATE_KEY" > secrets/MusicKit.p8
            chmod 644 secrets/MusicKit.p8
            touch .env
            for kv in "APPLE_MUSIC_TEAM_ID=$APPLE_MUSIC_TEAM_ID" "APPLE_MUSIC_KEY_ID=$APPLE_MUSIC_KEY_ID" \
                      "APPLE_MUSIC_PRIVATE_KEY_PATH=/secrets/MusicKit.p8" "APPLE_MUSIC_STOREFRONT=kr"; do
              k="${kv%%=*}"
              { grep -v "^$k=" .env || true; echo "$kv"; } > .env.tmp && mv .env.tmp .env
            done
          fi
          # Isolated docker config: the job's ghcr login (short-lived GITHUB_TOKEN)
          # must not clobber the operator's persistent PAT login in ~/.docker.
          export DOCKER_CONFIG=/tmp/hiphouse-deploy-docker
          mkdir -p "$DOCKER_CONFIG"
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml up -d
          docker image prune -f
          EOF
          } | ssh "$SERVER" bash -s
